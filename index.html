/* Botanical illustrations and action-specific microinteractions */
.lily-art{width:182px;height:182px;animation:lilyFloat 12s ease-in-out infinite;filter:drop-shadow(0 3px 6px #7194d044)}

.panel{position:relative;overflow:hidden}

const KEY='habify-v1',today=()=>new Date().toLocaleDateString('en-CA');let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch{}S=S||{name:'Sarah',habits:[{id:1,name:'Gym / workout',category:'Body'},{id:2,name:'No sweets',category:'Body'},{id:3,name:'Study',category:'Mind'},{id:4,name:'Practice Spanish',category:'Mind'},{id:5,name:'Read',category:'Mind'},{id:6,name:'Cardio / steps',category:'Body'},{id:7,name:'Stretch / mobility',category:'Body'},{id:8,name:'Drink enough water',category:'Energy'}],checks:{},water:{},steps:{},sleep:{},mood:{},energy:{},notes:{},reading:{title:'The Midnight Library',author:'Matt Haig',pages:120,total:320},reward:'',rewardUnlocked:{},theme:'light'};let page='Dashboard',selected=today(),month=new Date().getMonth(),year=new Date().getFullYear();const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),legacyDone=(id,d=selected)=>!!S.checks[d]?.includes(id),legacyCount=(d=selected)=>S.habits.filter(h=>legacyDone(h.id,d)).length,navs=[['Dashboard','◫'],['Progress','♧'],['Calendar','▣'],['Reading Log','▤'],['Habits','⚙'],['Settings','☼']];function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2200)}function show(p){page=p;render()}function toggle(id){let a=S.checks[selected]||[];S.checks[selected]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();render();celebrate('habit');if(count()===S.habits.length&&S.habits.length)toast('All habits complete — lovely work! ✨')}function changeDate(d){selected=d;render()}function panel(title,body,span='span4',extra=''){return `<section class="panel ${span}"><div class="heading"><span>${title}</span>${extra}</div>${body}</section>`}function calendar(){let n=new Date(year,month+1,0).getDate(),offset=(new Date(year,month,1).getDay()+6)%7,days=['M','T','W','T','F','S','S'].map(x=>`<div class="dow">${x}</div>`).join oughtful action is a seed for tomorrow.', 'Choose what makes your days feel more like yours.', 'Gentle discipline is still discipline.', 'Your future is shaped by the ordinary moments too.', 'Be proud of the care you put into today.', 'Slow progress is still a beautiful kind of progress.', 'Build a life you enjoy returning to each morning.', 'Let today be enough, and tomorrow be another chance.', 'There is grace in trying again.', 'Notice how far your small steps have carried you.'];function dailyQuote(date=today()){const parts=date.split("-").map(Number);const day=Math.floor(Date.UTC(parts[0],parts[1]-1,parts[2])/86400000);return DAILY_QUOTES[((day%DAILY_QUOTES.length)+DAILY_QUOTES.length)%DAILY_QUOTES.length]};function dashboard(){let total=S.habits.length,complete=count(),pct=total?Math.round(complete/total*100):0,w=S.water[selected]||0,st=S.steps[selected]||0,sl=S.sleep[selected]||0,m=S.mood[selected]??3,en=S.energy[selected]??3;return `<div class="grid">

${panel('☾ &nbsp; Sleep quality',`<div class="stat">${Math.floor(sl/60)}h ${sl%60}m / 8h</div><div class="muted">${sl>=480?'Well rested':'Sleep tracking'}</div><div class="bar"><div style="width:${Math.min(100,sl/480*100)}%"></div></div><button class="tiny" onclick="metric('sleep')">Log sleep</button>`,'span3',`<button class="circle" onclick="metric('sleep')">＋</button>`)}

${panel('▤ &nbsp; Notes',`<textarea class="notes" placeholder="Write your thoughts, gratitude, or anything on your mind..." oninput="noteSave(this.value)">${esc(S.notes[selected]||'')}</textarea>`,'span4')}

function baseRender(){document.getElementById('nav').innerHTML=navs.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="show('${n}')"><span>${i}</span>${n}</button>`).join('');document.getElementById('mobile').innerHTML=navs.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="show('${n}')">${i}<div>${n}</div></button>`).join('');document.getElementById('title').textContent=page==='Dashboard'?`${new Date().getHours()<12?'Good Morning':new Date().getHours()<18?'Good Afternoon':'Good Evening'}, ${S.name}!`:page;let c=document.getElementById('content');if(page==='Dashboard'){
const next=document.createElement('div');next.innerHTML=dashboard();
if(c.dataset.page==='Dashboard' && c.firstElementChild?.classList.contains('grid')){
 const oldCards=[...c.querySelectorAll('.grid > .panel')];
 const newCards=[...next.querySelectorAll('.grid > .panel')];
 newCards.forEach((fresh,i)=>{
   const old=oldCards[i];if(!old)return;
   // Keep unchanged cards, including the animated lily, water orb, and focused inputs.
   if(old.outerHTML!==fresh.outerHTML){
     const active=document.activeElement;
     if(active && old.contains(active) && active.tagName==='TEXTAREA')return;
     old.replaceWith(fresh);
   }
 });
 const oldFooter=c.querySelector('.footer'),newFooter=next.querySelector('.footer');
 if(oldFooter&&newFooter)oldFooter.textContent=newFooter.textContent;
}else c.innerHTML=next.innerHTML;
}if(page==='Calendar')c.innerHTML=`<div class="grid">${panel('Your calendar',calendar(),'span6')}${panel('Habits on '+selected,habitsList(),'span6')}</div>`;if(page==='Habits')c.innerHTML=`<div class="panel"><h2 class="subhead">Manage your habits</h2><button class="primary" onclick="habitModal()">＋ New habit</button>${S.habits.map(h=>`<div class="item"><div><b>${esc(h.name)}</b><div class="muted">${esc(h.category)}</div></div><div><button class="tiny" onclick="habitModal(${h.id})">Edit</button> <button class="tiny" onclick="deleteHabit(${h.id})">Delete</button></div></div>`).join('')}</div>`;if(page==='Progress'){let days=Array.from({length:14},(_,i)=>{let d=new Date();d.setDate(d.getDate()-13+i);return d.toLocaleDateString('en-CA')});c.innerHTML=`<div class="grid">${panel('Completion rate',`<div class="stat">${S.habits.length?Math.round(count(today())/S.habits.length*100):0}%</div><div class="bar"><div style="width:${S.habits.length?count(today())/S.habits.length*100:0}%"></div></div>`,'span6')}${panel('Last 14 days',`<div style="display:flex;align-items:end;height:170px;gap:7px">${days.map(d=>`<div title="${d}: ${count(d)} habits" style="flex:1;background:#a7b8f5;border-radius:8px 8px 2px 2px;height:${Math.max(5,count(d)/Math.max(1,S.habits.length)*100)}%;transition:.3s"></div>`).join('')}</div><div class="muted">Daily completion, oldest to newest</div>`,'span6')}${panel('Habit streaks',S.habits.map(h=>`<div class="item"><span>${esc(h.name)}</span><b>${streak(h.id)} days</b></div>`).join(''),'span12')}</div>`}if(page==='Reading Log')c.innerHTML=`<div class="grid">${panel('Current book',`<div class="book"><div class="cover">${esc(S.reading.title)}</div><div><b>${esc(S.reading.title)}</b><p>${esc(S.reading.author)}</p><div>${S.reading.pages}/${S.reading.total} pages</div></div></div><button class="widebtn" onclick="readingModal()">Edit book & progress</button>`,'span6')}${panel('Reading habit',`<div class="stat">${streak(S.habits.find(h=>/read/i.test(h.name))?.id)} days</div><p class="muted">Current reading streak</p>`,'span6')}</div>`;if(page==='Settings')c.innerHTML=`<div class="panel"><h2 class="subhead">Personalize Habify</h2><label>Your name</label><div class="formrow"><input class="field" id="username" value="${esc(S.name)}"><button class="primary" onclick="S.name=document.getElementById('username').value.trim()||'Friend';save();render();toast('Saved')">Save</button></div><h3>Data</h3><p class="muted">Stored locally on this device. Export a backup to move your habits to another browser.</p><button class="tiny" onclick="exportData()">Export backup</button> <button class="tiny" onclick="document.getElementById('importfile').click()">Import backup</button> <input class="hidden" type="file" id="importfile" accept=".json" onchange="importData(this)"><p><button class="tiny" onclick="resetData()">Reset all data</button></p></div>`;c.dataset.page=page}
function streak(id){if(!id)return 0;let d=new Date(),n=0;for(let i=0;i<366;i++){let k=d.toLocaleDateString('en-CA');if(!done(id,k)){if(i===0){d.setDate(d.getDate()-1);continue}break}n++;d.setDate(d.getDate()-1)}return n}
function setMood(n){S.mood[selected]=n;save();render();celebrate('mood')}function setEnergy(n){S.energy[selected]=+n;save();render();celebrate('mood')}function waterAdd(n){S.water[selected]=Math.max(0,(S.water[selected]||0)+n);save();render();celebrate('water')}function noteSave(t){S.notes[selected]=t;save()}function modal(title,body){document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2>${body}<div class="formrow"><button class="tiny" onclick="closeModal()">Cancel</button></div></div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function habitModal(id){let h=S.habits.find(h=>h.id===id);modal(h?'Edit habit':'Add a new habit',`<label>Habit name<input class="field" id="hname" maxlength="65" value="${esc(h?.name||'')}" placeholder="e.g. Morning walk"></label><label>Category<select class="field" id="hcat">${['Body','Mind','Energy','Other'].map(c=>`<option ${h?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><button class="widebtn" onclick="saveHabit(${id||0})">Save habit</button>`)}function saveHabit(id){let name=document.getElementById('hname').value.trim(),category=document.getElementById('hcat').value;if(!name)return toast('Enter a habit name');if(id){let h=S.habits.find(h=>h.id===id);h.name=name;h.category=category}else S.habits.push({id:Date.now(),name,category});save();closeModal();render();celebrate('habit');toast('Habit saved')}function deleteHabit(id){if(!confirm('Delete this habit?'))return;S.habits=S.habits.filter(h=>h.id!==id);save();render()}function metric(type){let isSleep=type==='sleep';modal(isSleep?'Log sleep':'Update steps',`<label>${isSleep?'Hours slept':'Step count'}<input class="field" type="number" id="metricval" min="0" max="${isSleep?24:100000}" step="${isSleep?.25:1}" value="${isSleep?(S.sleep[selected]||0)/60:S.steps[selected]||0}"></label><button class="widebtn" onclick="saveMetric('${type}')">Save</button>`)}function saveMetric(t){let n=Number(document.getElementById('metricval').value);if(!Number.isFinite(n)||n<0||n>(t==='sleep'?24:100000))return toast('Enter a valid number');if(t==='sleep')S.sleep[selected]=Math.round(n*60);else S.steps[selected]=Math.round(n);save();closeModal();render();celebrate(t==='sleep'?'sleep':'steps')}function readingModal(){modal('Reading log',`<label>Book title<input class="field" id="rt" value="${esc(S.reading.title)}"></label><label>Author<input class="field" id="ra" value="${esc(S.reading.author)}"></label><label>Pages read<input class="field" type="number" min="0" id="rp" value="${S.reading.pages}"></label><label>Total pages<input class="field" type="number" min="1" id="rmax" value="${S.reading.total}"></label><button class="widebtn" onclick="saveReading()">Save reading progress</button>`)}function saveReading(){let pages=+document.getElementById('rp').value,total=+document.getElementById('rmax').value;if(total<1||pages<0||pages>total)return toast('Check the page numbers');S.reading={title:document.getElementById('rt').value,author:document.getElementById('ra').value,pages,total};save();closeModal();render();celebrate('reading')}function reward(){if(count()!==S.habits.length||!S.habits.length)return toast('Complete all habits to unlock today’s reward');S.rewardUnlocked[selected]=true;save();modal('Your daily reward ✨',`<p>You kept your promises to yourself today. Enjoy a little moment of rest.</p><p class="muted">You completed ${count()} habits!</p>`)}function celebrate(kind){
const panels=[...document.querySelectorAll('.panel')];
const match={water:'Water rate',habit:"Today's goals",mood:'Mood & energy',energy:'Mood & energy',sleep:'Sleep quality',steps:'Activity',reading:'Reading'};
const p=panels.find(el=>el.querySelector('.heading')?.textContent.includes(match[kind]||'not-found'));
if(!p)return;
p.classList.remove('animate-'+kind);void p.offsetWidth;p.classList.add('animate-'+kind);
let target=kind==='water'?p.querySelector('.water-art'):kind==='habit'?p.querySelector('.scroll'):p.querySelector('.stat,.book,.moods,.water-art')||p;
if(target){target.classList.remove('feedback-pop');void target.offsetWidth;target.classList.add('feedback-pop')}
if(kind==='water'){const orb=p.querySelector('.water-art');if(orb){let splash=document.createElement('span');splash.className='splash-ripple';orb.parentElement.style.position='relative';orb.parentElement.appendChild(splash);setTimeout(()=>splash.remove(),850)}}
if(['habit','reading','sleep','steps','mood'].includes(kind)){let icons={habit:'✦',reading:'✧',sleep:'☾',steps:'✧',mood:'♡'};for(let i=0;i<5;i++){let sp=document.createElement('span');sp.className='feedback-particle';sp.textContent=icons[kind];sp.style.left=(25+i*12)+'%';sp.style.top=(30+(i%2)*12)+'%';sp.style.animationDelay=(i*.06)+'s';p.appendChild(sp);setTimeout(()=>sp.remove(),1100)}}
setTimeout(()=>p.classList.remove('animate-'+kind),1100)
}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='habify-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.habits)||typeof x.checks!=='object')throw Error();if(!confirm('Replace current data with this backup?'))return;S=x;save();render();toast('Backup imported')}catch{toast('Invalid backup file')}};r.readAsText(f)}function resetData(){if(confirm('Permanently erase all Habify data on this browser?')){localStorage.removeItem(KEY);location.reload()}}
// Habify phase 1–3 (except cloud sync): local-first enhancements.
S.categories ||= [{name:'Body',color:'#a5b6f5',icon:'◈'},{name:'Mind',color:'#e9a9dc',icon:'✧'},{name:'Energy',color:'#a8dcbf',icon:'☘'},{name:'Other',color:'#d8d4ec',icon:'◇'}];
S.values ||= {}; S.reflections ||= {}; S.rewards ||= [{id:1,name:'A little time just for me',threshold:100}];
S.books ||= [{id:1,...S.reading,notes:'',started:today(),finished:''}];
S.habits.forEach(h=>{h.schedule ||= {type:'daily',days:[1,2,3,4,5,6,0],times:3};h.target ||= 1;h.unit ||= 'times'});
function dateObj(d){return new Date(d+'T12:00:00')}
function scheduled(h,d){let a=h.schedule||{type:'daily'},day=dateObj(d).getDay();return a.type==='daily'||a.type==='weekly'||(a.type==='weekdays'&&(a.days||[]).includes(day))}
function weekKey(d){let x=dateObj(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toLocaleDateString('en-CA')}
function val(h,d=selected){return Number(S.values[d]?.[h.id]??(done(h.id,d)?(h.target||1):0))}
function completed(h,d=selected){return val(h,d)>=(h.target||1)}
function isWeekly(h){return h.schedule?.type==='weekly'}
function weeklyDone(h,d){let w=weekKey(d),n=0;for(let i=0;i<7;i++){let a=dateObj(w);a.setDate(a.getDate()+i);if(completed(h,a.toLocaleDateString('en-CA')))n++}return n}
function dueHabits(d=selected){return S.habits.filter(h=>scheduled(h,d))}
function progress(d=selected){let hs=dueHabits(d);return hs.length?hs.reduce((n,h)=>n+(isWeekly(h)?Math.min(1,weeklyDone(h,d)/(h.schedule.times||1)):Math.min(1,val(h,d)/(h.target||1))),0)/hs.length:0}
function count(d=selected){return dueHabits(d).filter(h=>isWeekly(h)?weeklyDone(h,d)>=(h.schedule.times||1):completed(h,d)).length}
function done(id,d=selected){let h=S.habits.find(x=>x.id===id);return h?completed(h,d):false}
function habitsList(){let hs=dueHabits();return `<div class="scroll">${hs.map(h=>{let v=val(h),goal=h.target||1,cat=S.categories.find(c=>c.name===h.category);return `<div class="habitrow enhanced-habit"><span style="color:${cat?.color||'#9ba9e5'}">${esc(cat?.icon||'◇')}</span><button class="habit-check ${completed(h)?'checked':''}" onclick="toggle(${h.id})" aria-label="Complete ${esc(h.name)}">${completed(h)?'✓':''}</button><span class="habit-name">${esc(h.name)}<small>${isWeekly(h)?`${weeklyDone(h,selected)}/${h.schedule.times||1} days this week`:goal>1?`${v}/${goal} ${esc(h.unit)}`:''}</small></span>${goal>1&&!isWeekly(h)?`<button class="tiny" onclick="logHabit(${h.id})">＋</button>`:''}</div>`}).join('')||'<p class="muted">No habits scheduled for this day.</p>'}</div>`}
function toggle(id){let h=S.habits.find(x=>x.id===id);if(!h)return;S.values[selected] ||= {};let was=completed(h);S.values[selected][id]=was?0:(h.target||1);let a=S.checks[selected]||[];S.checks[selected]=was?a.filter(x=>x!==id):[...new Set([...a,id])];save();render();celebrate('habit');if(!was&&progress()>=1){celebrate('lily');toast('Your lily is in full bloom ✨')}}
function logHabit(id){let h=S.habits.find(x=>x.id===id);if(!h)return;S.values[selected]||={};S.values[selected][id]=Math.min(h.target||1,val(h)+1);save();render();celebrate('habit')}
function streak(id){let h=S.habits.find(x=>x.id===id);if(!h)return 0;let n=0,d=dateObj(today());for(let i=0;i<365;i++){let k=d.toLocaleDateString('en-CA');if(!scheduled(h,k)){d.setDate(d.getDate()-1);continue}if(!completed(h,k)){if(i===0){d.setDate(d.getDate()-1);continue}break}n++;d.setDate(d.getDate()-1)}return n}
function bestStreak(h){let n=0,b=0,d=dateObj(today());for(let i=0;i<365;i++){let k=d.toLocaleDateString('en-CA');if(scheduled(h,k)){n=completed(h,k)?n+1:0;b=Math.max(b,n)}d.setDate(d.getDate()-1)}return b}
function habitModal(id){let h=S.habits.find(x=>x.id===id),a=h?.schedule||{type:'daily',days:[1,2,3,4,5,6,0],times:3};modal(h?'Edit habit':'Add a new habit',`<label>Habit name<input class="field" id="hname" maxlength="65" value="${esc(h?.name||'')}" placeholder="e.g. Read"></label><label>Category<select class="field" id="hcat">${S.categories.map(c=>`<option ${h?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Schedule<select class="field" id="hschedule" onchange="document.getElementById('scheduleopts').style.display=this.value==='daily'?'none':'block'"><option value="daily" ${a.type==='daily'?'selected':''}>Every day</option><option value="weekdays" ${a.type==='weekdays'?'selected':''}>Specific weekdays</option><option value="weekly" ${a.type==='weekly'?'selected':''}>Number of days per week</option></select></label><div id="scheduleopts" style="display:${a.type==='daily'?'none':'block'}"><label>Weekdays (for specific days)</label><div class="formrow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((day,i)=>`<label class="day-option"><input type="checkbox" name="hday" value="${i}" ${(a.days||[]).includes(i)?'checked':''}>${day}</label>`).join('')}</div><label>Days per week (for weekly goals)<input class="field" id="htimes" type="number" min="1" max="7" value="${a.times||3}"></label></div><label>Goal amount<input class="field" id="htarget" type="number" min="1" max="100000" value="${h?.target||1}"></label><label>Unit (times, minutes, pages, steps…)<input class="field" id="hunit" value="${esc(h?.unit||'times')}"></label><button class="widebtn" onclick="saveHabit(${id||0})">Save habit</button>`)}
function saveHabit(id){let name=document.getElementById('hname').value.trim(),category=document.getElementById('hcat').value,type=document.getElementById('hschedule').value,days=[...document.querySelectorAll('input[name=hday]:checked')].map(x=>+x.value),times=+document.getElementById('htimes').value,target=+document.getElementById('htarget').value,unit=document.getElementById('hunit').value.trim()||'times';if(!name||!Number.isInteger(target)||target<1||target>100000||type==='weekdays'&&!days.length||type==='weekly'&&(times<1||times>7))return toast('Please check the habit details');let h=id?S.habits.find(x=>x.id===id):{id:Date.now()};Object.assign(h,{name,category,target,unit,schedule:{type,days,times}});if(!id)S.habits.push(h);save();closeModal();render();toast('Habit saved')}
function categoryModal(){modal('Manage categories',`<div>${S.categories.map(c=>`<div class="item"><span style="color:${c.color}">${esc(c.icon)} ${esc(c.name)}</span><button class="tiny" onclick="removeCategory('${encodeURIComponent(c.name)}')">Delete</button></div>`).join('')}</div><label>New category name<input id="cname" class="field" placeholder="e.g. Creativity"></label><label>Color<input id="ccolor" type="color" value="#b6c9e9"></label><label>Symbol<input id="cicon" class="field" maxlength="3" value="✧"></label><button class="widebtn" onclick="addCategory()">Add category</button>`)}
function addCategory(){let name=document.getElementById('cname').value.trim();if(!name||S.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast('Enter a unique name');S.categories.push({name,color:document.getElementById('ccolor').value,icon:document.getElementById('cicon').value||'✧'});save();closeModal();render();toast('Category added')}
function removeCategory(n){let name=decodeURIComponent(n);if(S.habits.some(h=>h.category===name))return toast('Move habits to another category first');S.categories=S.categories.filter(c=>c.name!==name);save();categoryModal()}
function reward(){let eligible=S.rewards.filter(r=>progress()*100>=r.threshold);modal('Your rewards',`<p class="muted">Daily completion: ${Math.round(progress()*100)}%</p>${S.rewards.map(r=>`<div class="item"><span>${esc(r.name)} · ${r.threshold}%</span><b>${eligible.includes(r)?'Unlocked ✧':'Locked'}</b></div>`).join('')}<button class="widebtn" onclick="rewardModal()">Customize rewards</button>`)}
function rewardModal(){modal('Customize rewards',`<div>${S.rewards.map(r=>`<div class="item">${esc(r.name)} (${r.threshold}%) <button class="tiny" onclick="removeReward(${r.id})">Remove</button></div>`).join('')}</div><label>Reward<input id="rname" class="field" placeholder="An evening of my favorite show"></label><label>Unlock at daily completion (%)<input id="rthreshold" class="field" type="number" min="1" max="100" value="100"></label><button class="widebtn" onclick="addReward()">Add reward</button>`)}
function addReward(){let name=document.getElementById('rname').value.trim(),threshold=+document.getElementById('rthreshold').value;if(!name||threshold<1||threshold>100)return toast('Check the reward');S.rewards.push({id:Date.now(),name,threshold});save();rewardModal()}
function removeReward(id){S.rewards=S.rewards.filter(r=>r.id!==id);save();rewardModal()}
function booksView(){return `<div class="grid">${panel('Your bookshelf',`<button class="primary" onclick="bookModal()">＋ Add book</button>${S.books.map(b=>`<div class="item"><div><b>${esc(b.title)}</b><div class="muted">${esc(b.author||'')} · ${b.pages}/${b.total} pages · ${b.finished?'Finished':'Reading'}</div><div class="bar"><div style="width:${Math.min(100,b.pages/Math.max(1,b.total)*100)}%"></div></div></div><button class="tiny" onclick="bookModal(${b.id})">Edit</button></div>`).join('')}`,'span12')}</div>`}
function bookModal(id){let b=S.books.find(x=>x.id===id);modal(b?'Edit book':'Add book',`<label>Title<input id="btitle" class="field" value="${esc(b?.title||'')}"></label><label>Author<input id="bauthor" class="field" value="${esc(b?.author||'')}"></label><label>Pages read<input id="bpages" type="number" min="0" class="field" value="${b?.pages||0}"></label><label>Total pages<input id="btotal" type="number" min="1" class="field" value="${b?.total||200}"></label><label>Started<input id="bstarted" type="date" class="field" value="${b?.started||today()}"></label><label>Finished (optional)<input id="bfinished" type="date" class="field" value="${b?.finished||''}"></label><label>Notes<textarea id="bnotes" class="field" rows="3">${esc(b?.notes||'')}</textarea></label><button class="widebtn" onclick="saveBook(${id||0})">Save book</button>${b?`<button class="tiny" onclick="deleteBook(${id})">Delete book</button>`:''}`)}
function saveBook(id){let title=document.getElementById('btitle').value.trim(),pages=+document.getElementById('bpages').value,total=+document.getElementById('btotal').value;if(!title||total<1||pages<0||pages>total)return toast('Check book details');let b=id?S.books.find(x=>x.id===id):{id:Date.now()};Object.assign(b,{title,author:document.getElementById('bauthor').value,pages,total,started:document.getElementById('bstarted').value,finished:document.getElementById('bfinished').value,notes:document.getElementById('bnotes').value});if(!id)S.books.push(b);S.reading={title:b.title,author:b.author,pages:b.pages,total:b.total};save();closeModal();render();celebrate('reading');if(pages===total)toast('A book completed — lovely! ✨')}
function deleteBook(id){if(!confirm('Remove this book?'))return;S.books=S.books.filter(b=>b.id!==id);save();closeModal();render()}
function reflectionView(){let key=weekKey(selected),r=S.reflections[key]||{};return `<div class="panel"><h2 class="subhead">Weekly reflection · week of ${key}</h2><p class="muted">A gentle moment to reflect on your progress.</p>${[['wins','What went well?'],['challenges','What felt difficult?'],['next','What would you like to improve next week?']].map(([k,l])=>`<label style="display:block;margin:16px 0">${l}<textarea class="notes" oninput="saveReflection('${key}','${k}',this.value)">${esc(r[k]||'')}</textarea></label>`).join('')}</div>`}
function saveReflection(k,f,v){S.reflections[k]||={};S.reflections[k][f]=v;save()}
function enhancedProgress(){let days=Array.from({length:14},(_,i)=>{let d=dateObj(today());d.setDate(d.getDate()-13+i);return d.toLocaleDateString('en-CA')});return `<div class="grid">${panel('Today’s completion',`<div class="stat">${Math.round(progress(today())*100)}%</div><div class="bar"><div style="width:${progress(today())*100}%"></div></div>`,'span6')}${panel('Last 14 days',`<div style="display:flex;align-items:end;height:160px;gap:7px">${days.map(d=>`<div title="${d}: ${Math.round(progress(d)*100)}%" style="flex:1;background:#a7b8f5;border-radius:8px 8px 2px 2px;height:${Math.max(4,progress(d)*100)}%"></div>`).join('')}</div>`,'span6')}${panel('Habit streaks & personal bests',S.habits.map(h=>`<div class="item"><span>${esc(h.name)}</span><span class="muted">Current: <b>${streak(h.id)}</b> · Best: <b>${bestStreak(h)}</b> days</span></div>`).join(''),'span12')}</div>`}
function enhanceDashboard(){
const cards=[...document.querySelectorAll('#content > .grid > .panel')],bal=cards[0];if(!bal)return;
const rate=progress(),pct=Math.round(rate*100),cats=['Body','Mind','Energy'],colors=['#a5b6f5','#e9a9dc','#a8dcbf'];
let values=cats.map(c=>{let hs=dueHabits().filter(h=>h.category===c);return hs.length?hs.reduce((a,h)=>a+Math.min(1,val(h)/(h.target||1)),0)/hs.length:0});
let ring=bal.querySelector('.ring'),lily=bal.querySelector('.lily-art');
if(ring){ring.style.background=`conic-gradient(${colors[0]} 0 33.3%,${colors[1]} 33.3% 66.6%,${colors[2]} 66.6% 100%)`;ring.title=`${pct}% daily progress`}
if(lily){lily.style.setProperty('--bloom',(.78+.22*rate).toFixed(3));lily.style.setProperty('--bloom-rotation',(-7+7*rate)+'deg');lily.setAttribute('aria-label',`Blue lily ${pct}% open based on today's habit progress`)}
let tags=bal.querySelectorAll('.tag');tags.forEach((t,i)=>{t.textContent=`${cats[i]} · ${Math.round(values[i]*100)}%`;t.style.background=['#edf0ff','#fbeaf7','#e8f5ec'][i];t.style.color=['#667ed4','#c77eb8','#599b78'][i]});
let detail=bal.querySelector('.balance + .muted');if(detail)detail.textContent=`${count()} of ${dueHabits().length} habits completed · ${pct}% progress`;
}
function render(){
baseRender();
const c=document.getElementById('content');
if(page==='Dashboard')enhanceDashboard();
if(page==='Progress')c.innerHTML=enhancedProgress();
if(page==='Reading Log')c.innerHTML=booksView();
if(page==='Weekly Review')c.innerHTML=reflectionView();
if(page==='Habits'){
 let panel=c.querySelector('.panel');if(panel){
 let add=panel.querySelector('.primary');if(add)add.insertAdjacentHTML('afterend',' <button class="tiny" onclick="categoryModal()">Manage categories</button>');
 panel.querySelectorAll('.item').forEach((row,i)=>{let h=S.habits[i];if(!h)return;let detail=row.querySelector('.muted');if(detail)detail.textContent=`${h.category} · ${h.schedule.type==='daily'?'Daily':h.schedule.type==='weekdays'?'Selected weekdays':(h.schedule.times||1)+' days/week'} · ${h.target} ${h.unit}`})
 }}
let nav=document.getElementById('nav'),mobile=document.getElementById('mobile');if(!nav.querySelector('[data-reflection]'))nav.insertAdjacentHTML('beforeend',`<button data-reflection class="${page==='Weekly Review'?'active':''}" onclick="show('Weekly Review')">✧ Weekly Review</button>`);if(!mobile.querySelector('[data-reflection]'))mobile.insertAdjacentHTML('beforeend',`<button data-reflection class="${page==='Weekly Review'?'active':''}" onclick="show('Weekly Review')">✧<div>Review</div></button>`);
}
function celebrateLily(){let l=document.querySelector('.lily-art');if(l){l.classList.remove('lily-celebrate');void l.offsetWidth;l.classList.add('lily-celebrate');setTimeout(()=>l.classList.remove('lily-celebrate'),900)}}
const originalCelebrate=celebrate;
celebrate=function(kind){if(kind==='lily'){celebrateLily();return}originalCelebrate(kind)}

render();
</script></body></html>
